<!-- 1. Binding dynamic placeholder and initial value -->
<div>
    <label>Username:</label>
    <input type="text" [value]="initialUsername" [placeholder]="emailPlaceholder">
</div>

<!-- 2. Binding boolean properties directly -->
<div>
    <label>
        <input type="checkbox" [checked]="allowEmailNotifications">
        Enable Notifications
    </label>
</div>

<!-- 3. Controlling button availability via state -->
<div>
    <button [disabled]="isFormSubmitting">
        {{ isFormSubmitting ? 'Saving...' : 'Save Changes' }}
    </button>
</div>

<!-- Binding -->
<button class="border-1 bg-red-500" style="cursor: pointer;">Click Me!</button>
